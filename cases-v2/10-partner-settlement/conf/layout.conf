# Fixed-width layout of the partner ERP feed (byte offsets, 0-based).
# Record length is 64 bytes, newline-terminated. Spec: ERP-IF-07 rev.3.
#
#   name      offset:length
REC_TYPE=0:1
REC_DATE=1:8
# detail (D) records
D_SEQ=9:5
D_CODE=14:6
D_NAME=20:20
D_AMOUNT=40:12
D_MEMO=52:12
# header (H) records
H_SOURCE=9:16
# trailer (T) records
T_COUNT=9:6
T_TOTAL=15:15
